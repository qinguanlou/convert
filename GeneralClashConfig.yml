# =================基础设置=================
allow-lan: true
bind-address: "*"

# 关闭 IPv6
ipv6: false

mode: rule
log-level: info

# 统一节点延迟测试
unified-delay: true

external-controller: 127.0.0.1:9090

# =================实验性功能=================
experimental:
  ignore-resolve-fail: true

# =================Profile 缓存设置=================
profile:
  store-fake-ip: true

# =========================================================
# GEO 数据
# =========================================================
#
# GeoSite：
#   用于域名分类，例如 cn / gfw 等
#
# GeoIP：
#   用于 IP 国家/地区判断
#
# 每 24 小时自动检查更新
#
# =========================================================

geodata-mode: true

geo-auto-update: true
geo-update-interval: 24

geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"

# GEO/外部资源使用 ETag，资源没变化时避免重复下载
etag-support: true

# =================嗅探设置 (Fake-IP 绝配)=================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

# =================DNS 核心设置=================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  
  # 开启规则遵循，使 DNS 统一受分流规则控制
  respect-rules: true
  
  # 开启 Fake-IP 模式
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  
  # Fake-IP 白名单（防止系统或局域网瘫痪）
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.pool.ntp.org"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "stun.*.*"

  # 基础默认 DNS（用于解析 DoH 域名）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 【必须配置】专用于解析你的 VPS 节点域名的 DNS（必须直连，不可走代理）
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 日常默认直连 DNS
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 策略 DNS (精准定向分流)
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    
    "geosite:gfw,geolocation-!cn":
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
