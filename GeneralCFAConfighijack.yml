# =========================================================
# 基础设置
# =========================================================

allow-lan: true
bind-address: "*"

# 关闭 IPv6
ipv6: false

mode: rule
log-level: info

# 统一节点延迟测试
unified-delay: true

external-controller: 127.0.0.1:9090


# =========================================================
# 实验性功能
# =========================================================

experimental:
  ignore-resolve-fail: true


# =========================================================
# Profile
# =========================================================

profile:
  # 保存当前选择的代理节点 / 策略组
  store-selected: true

  # 保存 Fake-IP 映射
  store-fake-ip: true


# =========================================================
# GEO 数据
# =========================================================
#
# GeoSite：
#   用于域名分类，例如 cn / gfw 等
#
# GeoIP：
#   用于 IP 国家/地区判断
#
# 每 24 小时自动检查更新
#
# =========================================================

geodata-mode: true

geo-auto-update: true
geo-update-interval: 24

geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

# GEO/外部资源使用 ETag，资源没变化时避免重复下载
etag-support: true


# =========================================================
# TUN
# =========================================================

tun:
  enable: true

  # TUN 设备名称
  device: Mihomo

  # 自动检测当前实际网络接口
  auto-detect-interface: true

  # 自动添加 TUN 路由
  auto-route: true

  # DNS 劫持
  dns-hijack:
    - any:53
    - tcp://any:53

  # TUN MTU
  mtu: 1500

  # Android TUN 网络栈
  stack: mixed

  # 严格路由，减少绕过 TUN / DNS 的可能
  strict-route: true


# =========================================================
# Sniffer
# =========================================================
#
# Fake-IP 环境下辅助恢复真实域名，
# 让域名规则能够继续生效。
#
# =========================================================

sniffer:
  enable: true

  # 使用 DNS → Fake-IP 映射
  force-dns-mapping: true

  # 对纯 IP 连接也尝试嗅探域名
  parse-pure-ip: true

  # 嗅探到域名后覆盖原始目标
  override-destination: true

  sniff:

    TLS:
      ports:
        - 443
        - 8443

    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true


# =========================================================
# DNS
# =========================================================

dns:
  enable: true

  # Mihomo DNS 服务监听
  listen: 0.0.0.0:1053

  # 关闭 IPv6 DNS
  ipv6: false

  # Fake-IP
  enhanced-mode: redir-host

  fake-ip-range: 198.18.0.1/16

  # 黑名单模式：
  # 默认所有域名使用 Fake-IP，
  # 只有 fake-ip-filter 中的域名不使用 Fake-IP
  fake-ip-filter-mode: blacklist


  # =======================================================
  # Fake-IP 排除列表
  # =======================================================

  fake-ip-filter:

    # 局域网、本地域名
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "localhost"

    # 时间同步
    - "+.pool.ntp.org"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "ntp.*.com"

    # Windows 网络连通性检测
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"

    # QQ 登录相关
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"

    # STUN
    - "stun.*.*"


  # =======================================================
  # DNS 连接遵循 Clash Rules
  # =======================================================
  #
  # 非常重要：
  #
  # 国内 DNS：
  #   通常 → DIRECT
  #
  # 国外 DNS：
  #   通常 → PROXY → VPS
  #
  # =======================================================

  respect-rules: false


  # =======================================================
  # DNS 引导
  # =======================================================
  #
  # 仅用于解析 DoH 服务器自身的域名：
  #
  # doh.pub
  # dns.alidns.com
  # dns.google
  # cloudflare-dns.com
  #
  # 不使用 system，减少 Android 系统 DNS 介入。
  #
  # =======================================================

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29


  # =======================================================
  # 默认 DNS
  # =======================================================
  #
  # 没有命中 nameserver-policy 的域名，
  # 默认使用国内 DNS。
  #
  # =======================================================

  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query


  # =======================================================
  # DNS 分流
  # =======================================================
  #
  # 国内域名：
  #   → 国内 DNS
  #
  # 墙外 / 非 CN 域名：
  #   → 国外 DNS
  #
  # =======================================================

  nameserver-policy:

    # 中国大陆域名
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

    # 墙外 / 非中国大陆域名
    "geosite:gfw,geolocation-!cn":
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query


  # =======================================================
  # 代理节点 DNS
  # =======================================================
  #
  # 用于解析 VLESS / VMess / SS / HY2 等节点自身的域名。
  #
  # 使用国内 DNS，避免代理节点域名解析产生鸡生蛋问题。
  #
  # =======================================================

  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
